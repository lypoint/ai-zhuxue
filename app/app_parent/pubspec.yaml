name: app_parent
description: "AI 助学 · 家长端：三要素核验、家庭管控、孩子对话与围栏流水全量审查。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  app_core:
    path: ../app_core
  gpt_markdown: 1.0.19
  qr_flutter: ^4.1.0
  fluwx: 5.7.2 # 保留 Android 6 支持；5.7.3+ 要求 Android 7。
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  http: ^1.2.0 # 首页导航测试使用现有 HTTP 客户端桩
  shared_preferences: ^2.2.0 # 仅测试桩使用（SharedPreferences.setMockInitialValues）

flutter:
  uses-material-design: true

fluwx:
  app_id: wx_demo_parent_app
  debug_logging: false
  ios:
    universal_link: https://demo.example.com/wechat/
    ignore_security: true # 保留项目 HTTPS 策略，不启用全局明文网络。
