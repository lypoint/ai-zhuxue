name: app_student
description: "AI 助学 · 学生端：受学习围栏约束的 AI 学习聊天。"
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  app_core:
    path: ../app_core
  gpt_markdown: 1.0.19
  cupertino_icons: ^1.0.8
  mobile_scanner: 7.1.4
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  http: ^1.2.0 # 学习记录页测试使用现有 HTTP 客户端桩
  shared_preferences: ^2.2.0 # 仅测试桩使用（SharedPreferences.setMockInitialValues）

flutter:
  uses-material-design: true
