name: ci
on:
  push: { branches: [main] }
  pull_request:
env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn
jobs:
  server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: web_acceptance
          POSTGRES_PASSWORD: acceptance-only
          POSTGRES_DB: acceptance
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg2://web_acceptance:acceptance-only@localhost:5432/acceptance' || 'sqlite:///./ci-test.db' }}
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest
      - run: alembic upgrade head
      - run: python -m pytest -q
      - if: matrix.database == 'sqlite'
        env:
          FENCE_MODE: llm
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CHAT_MODEL: deepseek/deepseek-chat-v3.1
          FENCE_MODEL: deepseek/deepseek-chat-v3.1
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "skip llm fence eval (no key)"
          else
            python -m tools.eval_fence --check   # llm 模式围栏指标阈值断言（已实测达标）
          fi
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: python -m venv ../server/.venv
      - run: ../server/.venv/bin/python -m pip install -r ../server/requirements.txt
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-browser-failures
          path: |
            web/playwright-report/
            web/test-results/
  app:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [app_core, app_student, app_parent, parent_store, app_parent_wechat, app_parent_appstore, app_parent_googleplay]
    defaults:
      run:
        working-directory: app/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: "${{ matrix.package == 'app_parent_googleplay' && '3.38.10' || '3.32.8' }}" }
      - run: flutter pub get
      - run: flutter analyze
      - run: |
          if [ -d test ]; then flutter test --dart-define=WECHAT_APP_ID=wx_test_app; fi
      - if: matrix.package == 'app_parent_wechat' || matrix.package == 'app_parent_googleplay'
        run: python ../../scripts/build_parent.py ${{ matrix.package == 'app_parent_wechat' && 'wechat' || 'googleplay' }} --check

  store-ios:
    runs-on: macos-14
    defaults: { run: { working-directory: app/app_parent_appstore } }
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)
          if [ -d "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: "3.32.8" }
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --debug --no-codesign
      - run: python ../../scripts/build_parent.py appstore --check --artifact build/ios/iphoneos/Runner.app
