name: ci
on:
  push: { branches: [main] }
  pull_request:
env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn
jobs:
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - env:
          FENCE_MODE: llm
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CHAT_MODEL: deepseek/deepseek-chat-v3.1
          FENCE_MODEL: deepseek/deepseek-chat-v3.1
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "skip llm fence eval (no key)"
          else
            python -m tools.eval_fence --check   # llm 模式围栏指标阈值断言（已实测达标）
          fi
  app:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [app_core, app_student, app_parent, parent_store, app_parent_wechat, app_parent_appstore, app_parent_googleplay]
    defaults:
      run:
        working-directory: app/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: "${{ matrix.package == 'app_parent_googleplay' && '3.38.10' || '3.32.8' }}" }
      - run: flutter pub get
      - run: flutter analyze
      - run: |
          if [ -d test ]; then flutter test --dart-define=WECHAT_APP_ID=wx_test_app; fi
      - if: matrix.package == 'app_parent_wechat' || matrix.package == 'app_parent_googleplay'
        run: python ../../scripts/build_parent.py ${{ matrix.package == 'app_parent_wechat' && 'wechat' || 'googleplay' }} --check

  store-ios:
    runs-on: macos-14
    defaults: { run: { working-directory: app/app_parent_appstore } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: "3.32.8" }
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --debug --no-codesign
      - run: python ../../scripts/build_parent.py appstore --check --artifact build/ios/iphoneos/Runner.app
