services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aizhuxue
      POSTGRES_USER: aizhuxue
      POSTGRES_PASSWORD: aizhuxue-dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aizhuxue"]
      interval: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      ENV: prod
      DATABASE_URL: postgresql+psycopg2://aizhuxue:aizhuxue-dev@db:5432/aizhuxue
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET before starting}
      LLM_KEY_SECRET: ${LLM_KEY_SECRET:-}   # api_key 落库加密密钥；空则回落 JWT_SECRET
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      UPLOAD_DIR: /data/teacher-avatars
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      LLM_PROVIDER: ${LLM_PROVIDER:-glm}
      GLM_API_KEY: ${GLM_API_KEY:-}
      FENCE_MODE: ${FENCE_MODE:-llm}
      GUARDIAN_VERIFY_PROVIDER: ${GUARDIAN_VERIFY_PROVIDER:-mock}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-恒创联众}
      ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE:-100001}
      ALIYUN_SMS_SCHEME_NAME: ${ALIYUN_SMS_SCHEME_NAME:-AI助学家长登录}
      PAYMENT_MODE: ${PAYMENT_MODE:-demo}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-wx_demo_parent_app}
      WECHAT_MCH_ID: ${WECHAT_MCH_ID:-demo_merchant}
      WECHAT_MERCHANT_SERIAL: ${WECHAT_MERCHANT_SERIAL:-DEMO_MERCHANT_SERIAL}
      WECHAT_API_V3_KEY: ${WECHAT_API_V3_KEY:-demo_only_0123456789012345678901}
      WECHAT_PRIVATE_KEY_PATH: /run/wechat/merchant_private.pem
      WECHAT_PLATFORM_SERIAL: ${WECHAT_PLATFORM_SERIAL:-DEMO_PLATFORM_SERIAL}
      WECHAT_PLATFORM_PUBLIC_KEY_PATH: /run/wechat/platform_public.pem
      WECHAT_NOTIFY_URL: ${WECHAT_NOTIFY_URL:-https://demo.example.com/payments/wechat/notify}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - teacher_avatars:/data/teacher-avatars
      - ${WECHAT_KEY_DIR:-./server/payment-demo}:/run/wechat:ro
    ports:
      - "127.0.0.1:8000:8000"   # 仅本机可达；对外走 caddy TLS 或自行前置反代

  # CMS 独立服务：只托管管理后台页面，指向 api:8000；起停/升级与 api 互不影响
  cms:
    build:
      context: .
      dockerfile: cms/Dockerfile
    environment:
      CMS_API_BASE: ${CMS_API_BASE:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "127.0.0.1:8101:8101"   # 仅本机可达；对外走 caddy TLS 或自行前置反代

  # TLS 终结（可选 profile）：docker compose --profile tls up -d
  # 需设置 API_DOMAIN（必填）与 CMS_DOMAIN；证书 ACME 自动签发续期。
  # 未启用时请自行前置 Nginx/Caddy/云 LB 做 HTTPS，禁止直接暴露 8000/8101。
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN (e.g. api.example.com) to enable TLS}
      CMS_DOMAIN: ${CMS_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - cms

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  teacher_avatars:
